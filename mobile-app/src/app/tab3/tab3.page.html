<ion-header [translucent]="true" class="glass-header">
  <ion-toolbar>
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="liquid-bg page-pad">
  <section class="glass-card profile-card">
    <div class="avatar">
      <ion-icon name="person"></ion-icon>
    </div>
    <h2>{{ user?.username || '—' }}</h2>
    <p class="role">{{ user?.roleLabel || user?.role }}</p>
  </section>

  <section class="glass-card">
    <h3>Configuración</h3>
    <ion-list lines="none" class="glass-list">
      <ion-item class="glass-list-item">
        <ion-icon name="server-outline" slot="start"></ion-icon>
        <ion-label>
          <p>API backend</p>
          <h3>{{ apiUrl }}</h3>
        </ion-label>
      </ion-item>
      <ion-item class="glass-list-item">
        <ion-icon name="shield-checkmark-outline" slot="start"></ion-icon>
        <ion-label>
          <p>Módulos autorizados</p>
          <h3>{{ user?.pages?.join(', ') || '—' }}</h3>
        </ion-label>
      </ion-item>
      <ion-item class="glass-list-item">
        <ion-icon name="sparkles-outline" slot="start"></ion-icon>
        <ion-label>
          <p>Tools del asistente</p>
          <h3>{{ user?.aiTools?.length || 0 }} disponibles</h3>
        </ion-label>
      </ion-item>
    </ion-list>
  </section>

  <ion-button expand="block" fill="outline" class="logout-btn" (click)="logout()">
    Cerrar sesión
  </ion-button>
</ion-content>
