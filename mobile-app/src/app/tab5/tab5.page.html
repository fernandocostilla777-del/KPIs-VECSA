<ion-header [translucent]="true" class="glass-header">
  <ion-toolbar>
    <ion-title>Asistente</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="clearChat()" [disabled]="loading">
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="liquid-bg page-pad assistant-content">
  <div class="role-chip" *ngIf="roleLabel">Alcance · {{ roleLabel }}</div>

  <div *ngIf="error" class="glass-card error-card">{{ error }}</div>

  <div class="chat-stream">
    <div
      *ngFor="let msg of messages"
      class="bubble"
      [class.user]="msg.role === 'user'"
      [class.bot]="msg.role === 'assistant'"
    >
      <div
        class="bubble-text md-prose"
        *ngIf="msg.role === 'assistant'; else userText"
        [innerHTML]="formatReply(msg.content)"
      ></div>
      <ng-template #userText>
        <p class="bubble-text">{{ msg.content }}</p>
      </ng-template>

      <div class="hl-row" *ngIf="msg.highlights?.length">
        <div class="hl-chip" *ngFor="let h of msg.highlights">
          <span>{{ h.label }}</span>
          <strong>{{ h.value }}</strong>
        </div>
      </div>

      <div class="tools-row" *ngIf="msg.toolsUsed?.length">
        <span class="tool-badge" *ngFor="let t of msg.toolsUsed">{{ t }}</span>
      </div>
    </div>

    <div class="bubble bot typing" *ngIf="loading">
      <ion-spinner name="dots"></ion-spinner>
      <span>Pensando…</span>
    </div>
  </div>

  <div class="prompts" *ngIf="ready && !loading">
    <button
      type="button"
      class="prompt-chip"
      *ngFor="let p of prompts"
      (click)="usePrompt(p)"
    >{{ p }}</button>
  </div>
</ion-content>

<ion-footer class="assistant-footer">
  <div class="composer glass-card">
    <ion-textarea
      [(ngModel)]="draft"
      rows="2"
      autoGrow="true"
      placeholder="Pregunta breve…"
      [disabled]="loading || !ready"
      (keyup.enter)="send()"
    ></ion-textarea>
    <ion-button
      shape="round"
      (click)="send()"
      [disabled]="loading || !ready || !draft.trim()"
    >
      <ion-icon slot="icon-only" name="send"></ion-icon>
    </ion-button>
  </div>
</ion-footer>
